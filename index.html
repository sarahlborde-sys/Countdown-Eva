<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ferien-Countdown</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#0b0f1a;
      color:white;
    }

    .card{
      width:min(920px, 92vw);
      border-radius:24px;
      overflow:hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
    }

    .hero{
      position:relative;
      aspect-ratio: 16/9;
      background: url("AdobeStock_382719792.jpeg.avif") center/cover no-repeat;
    }

    .overlay{
      position:absolute;
      inset:0;
      background: linear-gradient(to top, rgba(0,0,0,.70), rgba(0,0,0,.08));
    }

    .content{
      padding:22px 22px 26px;
      display:grid;
      gap:12px;
    }

    h1{
      margin:0;
      font-size: clamp(22px, 3.5vw, 36px);
    }

    .sub{
      opacity:.9;
      margin:0;
    }

    .timer{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .box{
      flex:1 1 160px;
      padding:18px 14px;
      border-radius:18px;
      background: rgba(255,255,255,.08);
      text-align:center;
    }

    .num{
      font-size: clamp(30px, 4.5vw, 52px);
      font-weight:800;
      line-height:1;
    }

    .lbl{
      opacity:.85;
      margin-top:8px;
      font-size: 15px;
    }

    .footer{
      opacity:.75;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="hero">
      <div class="overlay"></div>
    </div>

    <div class="content">
      <h1>Countdown bis zu den Ferien ✨</h1>
      <p class="sub">27.02.2026 – 15:55 Uhr (Berlin)</p>

      <div class="timer">
        <div class="box">
          <div class="num" id="d">–</div>
          <div class="lbl">Tage</div>
        </div>

        <div class="box">
          <div class="num" id="h">–</div>
          <div class="lbl">Stunden</div>
        </div>

        <div class="box">
          <div class="num" id="m">–</div>
          <div class="lbl">Minuten</div>
        </div>
      </div>

      <div class="footer" id="status"></div>
    </div>

  </div>

  <script>
    // Zielzeit: 27.02.2026, 15:55 Uhr (Deutschland)
    const targetISO = "2026-02-27T15:55:00+01:00";

    function tick(){
      const target = new Date(targetISO).getTime();
      const now = Date.now();
      let diffMs = target - now;

      if (diffMs <= 0) {
        document.getElementById("d").textContent = "0";
        document.getElementById("h").textContent = "0";
        document.getElementById("m").textContent = "0";
        document.getElementById("status").textContent = "🎉 Es sind Ferien!";
        return;
      }

      const totalMinutes = Math.ceil(diffMs / (1000 * 60));

      const days = Math.floor(totalMinutes / (60 * 24));
      const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
      const mins = totalMinutes % 60;

      document.getElementById("d").textContent = days;
      document.getElementById("h").textContent = String(hours).padStart(2,"0");
      document.getElementById("m").textContent = String(mins).padStart(2,"0");

      document.getElementById("status").textContent = "Noch kurz durchhalten… dann sind Ferien ❤️";
    }

    tick();
    setInterval(tick, 15000);
  </script>

</body>
</html>
